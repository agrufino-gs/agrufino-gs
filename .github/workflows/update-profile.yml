name: Update engineering profile

on:
  workflow_dispatch:

  schedule:
    # Se ejecuta diariamente a una hora poco común para evitar
    # los periodos de mayor saturación de GitHub Actions.
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-generation
  cancel-in-progress: true

jobs:
  generate-profile:
    name: Generate command center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate engineering command center
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-profile.mjs

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated profile
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "profile-engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/engineering-command-center.svg
          git commit -m "chore(profile): refresh engineering command center"
          git push