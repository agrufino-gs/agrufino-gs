<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-labelledby="title description">
    <title id="title">Opendex Identity and Security Engineering</title>

    <desc id="description">
        Animated technical header for the Opendex GitHub profile.
    </desc>

    <rect width="1200" height="320" rx="18" fill="#0D1117" />

    <rect x="1" y="1" width="1198" height="318" rx="17" stroke="#30363D" stroke-width="2" />

    <!-- Technical grid -->

    <g stroke="#21262D" stroke-width="1" opacity="0.85">
        <path d="M0 40H1200" />
        <path d="M0 80H1200" />
        <path d="M0 120H1200" />
        <path d="M0 160H1200" />
        <path d="M0 200H1200" />
        <path d="M0 240H1200" />
        <path d="M0 280H1200" />

        <path d="M40 0V320" />
        <path d="M80 0V320" />
        <path d="M120 0V320" />
        <path d="M160 0V320" />
        <path d="M200 0V320" />
        <path d="M240 0V320" />
        <path d="M280 0V320" />
        <path d="M320 0V320" />
        <path d="M360 0V320" />
        <path d="M400 0V320" />
        <path d="M440 0V320" />
        <path d="M480 0V320" />
        <path d="M520 0V320" />
        <path d="M560 0V320" />
        <path d="M600 0V320" />
        <path d="M640 0V320" />
        <path d="M680 0V320" />
        <path d="M720 0V320" />
        <path d="M760 0V320" />
        <path d="M800 0V320" />
        <path d="M840 0V320" />
        <path d="M880 0V320" />
        <path d="M920 0V320" />
        <path d="M960 0V320" />
        <path d="M1000 0V320" />
        <path d="M1040 0V320" />
        <path d="M1080 0V320" />
        <path d="M1120 0V320" />
        <path d="M1160 0V320" />
    </g>

    <!-- Top status bar -->

    <rect x="40" y="32" width="1120" height="38" rx="8" fill="#161B22" stroke="#30363D" />

    <circle cx="62" cy="51" r="5" fill="#3FB950">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" />
    </circle>

    <text x="78" y="56" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="13" letter-spacing="1.5">
        SYSTEM STATUS / ENGINEERING ACTIVE
    </text>

    <text x="1126" y="56" fill="#3FB950" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12"
        letter-spacing="1">
        SECURE
    </text>

    <!-- Brand marker -->

    <rect x="70" y="112" width="8" height="112" rx="4" fill="#2F81F7">
        <animate attributeName="height" values="70;112;70" dur="4s" repeatCount="indefinite" />

        <animate attributeName="y" values="133;112;133" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Main identity -->

    <text x="110" y="153" fill="#F0F6FC"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="56" font-weight="700" letter-spacing="7">
        OPENDEX
    </text>

    <text x="113" y="191" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="17" letter-spacing="3">
        IDENTITY &amp; SECURITY ENGINEERING
    </text>

    <text x="113" y="226" fill="#C9D1D9"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="15" letter-spacing="0.6">
        Building secure infrastructure for modern software.
    </text>

    <!-- Animated cursor -->

    <rect x="535" y="211" width="9" height="19" fill="#2F81F7">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <!-- Architecture panel -->

    <rect x="760" y="100" width="360" height="152" rx="12" fill="#161B22" stroke="#30363D" />

    <text x="785" y="128" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="11" letter-spacing="1.5">
        ARCHITECTURE / IDENTITY CONTROL PLANE
    </text>

    <!-- Network paths -->

    <path d="M805 188H875V153H945V188H1015V153H1080" stroke="#2F81F7" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" repeatCount="indefinite" />
    </path>

    <path d="M805 212H900V229H987V212H1080" stroke="#3FB950" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" stroke-dasharray="5 7">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="2.8s" repeatCount="indefinite" />
    </path>

    <!-- Network nodes -->

    <g fill="#0D1117" stroke="#2F81F7" stroke-width="2">
        <circle cx="805" cy="188" r="7">
            <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite" />
        </circle>

        <circle cx="875" cy="153" r="7">
            <animate attributeName="r" values="7;10;7" dur="3s" repeatCount="indefinite" />
        </circle>

        <circle cx="945" cy="188" r="7">
            <animate attributeName="r" values="6;9;6" dur="2.7s" repeatCount="indefinite" />
        </circle>

        <circle cx="1015" cy="153" r="7">
            <animate attributeName="r" values="7;10;7" dur="3.3s" repeatCount="indefinite" />
        </circle>

        <circle cx="1080" cy="153" r="7">
            <animate attributeName="r" values="6;9;6" dur="2.1s" repeatCount="indefinite" />
        </circle>
    </g>

    <g fill="#0D1117" stroke="#3FB950" stroke-width="2">
        <circle cx="805" cy="212" r="6" />
        <circle cx="900" cy="229" r="6" />
        <circle cx="987" cy="212" r="6" />
        <circle cx="1080" cy="212" r="6" />
    </g>

    <!-- Bottom metadata -->

    <text x="40" y="292" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="11" letter-spacing="1.4">
        OPEN ARCHITECTURE / TRUSTED CODE / EXPLICIT SECURITY BOUNDARIES
    </text>

    <text x="1160" y="292" fill="#484F58" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11"
        letter-spacing="1.4">
        OPENDEX.DEV
    </text>

    <!-- Animated scanner -->

    <rect x="0" y="78" width="1200" height="1" fill="#2F81F7" opacity="0">
        <animate attributeName="y" values="78;292" dur="5s" repeatCount="indefinite" />

        <animate attributeName="opacity" values="0;0.22;0.22;0" dur="5s" repeatCount="indefinite" />
    </rect>
</svg>