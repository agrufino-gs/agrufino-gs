      }

      .metric-label {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 9px;
        font-weight: 600;
        letter-spacing: 1.4px;
        fill: #7D8590;
      }

      .metric-value {
        font-family:
          Inter,
