```svg
<?xml version="1.0" encoding="UTF-8"?>

<svg
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Agrufino Guzmán Gómez Engineering Command Center
  </title>

  <desc id="description">
    Personal engineering command center focused on identity, security,
    automation, architecture and reliable software systems.
  </desc>

  <defs>

    <!-- Background grid -->

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#1A2029"
        stroke-width="1"
      />
    </pattern>

    <!-- Subgrid -->

    <pattern
      id="microGrid"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="1"
        cy="1"
        r="0.6"
        fill="#2A313C"
      />
    </pattern>

    <!-- Main accent -->

    <linearGradient
      id="primaryAccent"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#58A6FF"
      />

      <stop
        offset="50%"
        stop-color="#8B5CF6"
      />

      <stop
        offset="100%"
        stop-color="#2DD4BF"
      />
    </linearGradient>

    <!-- Top line -->

    <linearGradient
      id="topLine"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#58A6FF"
        stop-opacity="0"
      />

      <stop
        offset="18%"
        stop-color="#58A6FF"
      />

      <stop
        offset="50%"
        stop-color="#8B5CF6"
      />

      <stop
        offset="82%"
        stop-color="#2DD4BF"
      />

      <stop
        offset="100%"
        stop-color="#2DD4BF"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Panel gradient -->

    <linearGradient
      id="panelSurface"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#171C24"
      />

      <stop
        offset="100%"
        stop-color="#11161D"
      />
    </linearGradient>

    <!-- Scan line -->

    <linearGradient
      id="scanGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#58A6FF"
        stop-opacity="0"
      />

      <stop
        offset="50%"
        stop-color="#58A6FF"
        stop-opacity="0.65"
      />

      <stop
        offset="100%"
        stop-color="#58A6FF"
        stop-opacity="0"
      />
    </linearGradient>

    <!-- Glow -->

    <filter
      id="softGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter
      id="strongGlow"
      x="-150%"
      y="-150%"
      width="400%"
      height="400%"
    >
      <feGaussianBlur
        stdDeviation="7"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle texture -->

    <filter
      id="texture"
      x="0"
      y="0"
      width="100%"
      height="100%"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="3"
        seed="24"
        result="noise"
      />

      <feColorMatrix
        in="noise"
        type="saturate"
        values="0"
      />

      <feComponentTransfer>
        <feFuncA
          type="table"
          tableValues="0 0.035"
        />
      </feComponentTransfer>
    </filter>

    <!-- Clip -->

    <clipPath id="frameClip">
      <rect
        x="1"
        y="1"
        width="1198"
        height="558"
        rx="18"
      />
    </clipPath>

    <!-- Typography -->

    <style>
      .mono {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .sans {
        font-family:
          Inter,
