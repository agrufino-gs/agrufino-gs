    </g>

    <!-- Moving data signal -->

    <path
      d="M816 271H868L887 258L913 283L942 260L968 271H1109"
      stroke="#58A6FF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="8 8"
      opacity="0.85"
    >
      <animate
        attributeName="stroke-dashoffset"
        from="32"
        to="0"
        dur="2.2s"
        repeatCount="indefinite"
      />
    </path>

    <circle
      cx="1109"
      cy="271"
      r="5"
      fill="#3FB950"
      filter="url(#softGlow)"
    >
      <animate
        attributeName="r"
        values="4;7;4"
        dur="2s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.45;1;0.45"
        dur="2s"
        repeatCount="indefinite"
      />
