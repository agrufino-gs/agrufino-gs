      <rect x="1058" y="213" width="51" height="4" rx="2" fill="#21262D" />
      <rect x="1058" y="213" width="44" height="4" rx="2" fill="#3FB950">
        <animate
          attributeName="width"
          values="28;44;35;44"
          dur="5.2s"
