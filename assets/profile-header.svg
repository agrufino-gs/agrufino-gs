      <rect x="1058" y="241" width="51" height="4" rx="2" fill="#21262D" />
      <rect x="1058" y="241" width="32" height="4" rx="2" fill="#58A6FF">
        <animate
          attributeName="width"
          values="18;32;25;32"
          dur="4.5s"
          repeatCount="indefinite"
        />
