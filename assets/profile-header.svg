    <!-- Top control strip -->

    <rect
      x="28"
      y="24"
      width="1144"
      height="42"
      rx="9"
      fill="#161B22"
      stroke="#30363D"
    />

    <circle cx="51" cy="45" r="5" fill="#3FB950">
      <animate
        attributeName="opacity"
        values="0.35;1;0.35"
        dur="2.2s"
