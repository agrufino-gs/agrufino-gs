<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Agrufino Guzmán Gómez — Identity and Security Engineer
  </title>

  <desc id="description">
   GitHub profile header for software engineer Agrufino Guzmán Gómez.
  </desc>

  <defs>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="18" />
    </clipPath>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect
      width="1200"
      height="360"
      fill="#0D1117"
    />

    <!-- Technical background grid -->

    <g
      stroke="#21262D"
      stroke-width="1"
      opacity="0.72"
    >
      <path d="M0 40H1200" />
      <path d="M0 80H1200" />
      <path d="M0 120H1200" />
      <path d="M0 160H1200" />
      <path d="M0 200H1200" />
      <path d="M0 240H1200" />
      <path d="M0 280H1200" />
      <path d="M0 320H1200" />

      <path d="M40 0V360" />
      <path d="M80 0V360" />
      <path d="M120 0V360" />
      <path d="M160 0V360" />
      <path d="M200 0V360" />
      <path d="M240 0V360" />
      <path d="M280 0V360" />
      <path d="M320 0V360" />
      <path d="M360 0V360" />
      <path d="M400 0V360" />
      <path d="M440 0V360" />
      <path d="M480 0V360" />
      <path d="M520 0V360" />
      <path d="M560 0V360" />
      <path d="M600 0V360" />
      <path d="M640 0V360" />
      <path d="M680 0V360" />
      <path d="M720 0V360" />
      <path d="M760 0V360" />
      <path d="M800 0V360" />
      <path d="M840 0V360" />
      <path d="M880 0V360" />
      <path d="M920 0V360" />
      <path d="M960 0V360" />
      <path d="M1000 0V360" />
      <path d="M1040 0V360" />
      <path d="M1080 0V360" />
      <path d="M1120 0V360" />
      <path d="M1160 0V360" />
